baseURL = 'https://petrurobu.ro/'
languageCode = 'en-us'
title = 'Petru Blog'
theme = 'PaperMod'

[menu]
  [[menu.main]]
    name = "Programming"
    url = "/categories/programming/"
    weight = 10

  [[menu.main]]
    name = "Misc"
    url = "/categories/misc/"
    weight = 30

  [[menu.main]]
    name = "Search"
    url = "/search/"
    weight = 40


[params]
    defaultTheme = "light"
    ShowReadingTime = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    TocOpen = true
    ShowRssButtonInSectionTermList = true
    hideFooter = true

    [params.profileMode]
        enabled = true
        title = "Welcome to my blog"
        subtitle = "This blog is intended as a way to share my interests with others. You can find articles here ranging from programming, technical articles to music, art and movie reviews."

    [[params.socialIcons]]
    name = "github"
    url = "https://github.com/petru-robu"

    [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@petru-robu64"


[outputs]
  home = ["HTML", "RSS", "JSON"]
